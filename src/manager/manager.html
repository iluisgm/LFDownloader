<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downloads · LFDownloader</title>
  <link rel="icon" href="../assets/icons/icon-32.png">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><span id="logo"></span><div><b>LFDownloader</b><small>Download manager</small></div></div>

      <nav class="nav" id="nav">
        <button data-view="all" aria-current="true"><i data-icon="list" data-size="17"></i>All downloads<span data-n="all"></span></button>
        <button data-view="active"><i data-icon="download" data-size="17"></i>In progress<span data-n="active"></span></button>
        <button data-view="completed"><i data-icon="check" data-size="17"></i>Completed<span data-n="completed"></span></button>
        <button data-view="failed"><i data-icon="alert" data-size="17"></i>Failed &amp; stopped<span data-n="failed"></span></button>
      </nav>

      <div class="nav-title">Type</div>
      <nav class="nav" id="kinds">
        <button data-kind="video"><span class="kdot video"></span>Video<span data-k="video"></span></button>
        <button data-kind="audio"><span class="kdot audio"></span>Audio<span data-k="audio"></span></button>
        <button data-kind="image"><span class="kdot image"></span>Images<span data-k="image"></span></button>
      </nav>

      <div class="side-foot">
        <div class="stat"><small>Saved with LFDownloader</small><b id="total-size">0 B</b></div>
        <div class="keep-open" id="keep-open" hidden>
          <i data-icon="alert" data-size="15"></i>
          <span>Keep this window open while streams download.</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="bar">
        <div class="search">
          <i data-icon="search" data-size="16"></i>
          <input id="search" class="input" type="search" placeholder="Search downloads" autocomplete="off">
          <kbd>/</kbd>
        </div>
        <div class="bar-actions">
          <button class="btn btn-ghost" id="btn-clear"><i data-icon="trash" data-size="15"></i>Clear finished</button>
          <button class="icon-btn" id="btn-theme" title="Toggle theme"><i data-icon="moon"></i></button>
          <button class="icon-btn" id="btn-settings" title="Settings"><i data-icon="settings"></i></button>
          <button class="btn btn-primary" id="btn-add"><i data-icon="plus" data-size="16"></i>Add link</button>
        </div>
      </header>

      <section class="content" id="content"></section>

      <section class="empty" id="empty" hidden>
        <div class="empty-art" aria-hidden="true">
          <div class="ea-card c1"></div><div class="ea-card c2"></div>
          <div class="ea-card c3"><span id="empty-logo"></span></div>
        </div>
        <h2 id="empty-title">No downloads yet</h2>
        <p id="empty-text">Open a page with a video or song, click the LFDownloader icon, and pick a quality. Your files show up here.</p>
        <button class="btn btn-soft" id="btn-add-2"><i data-icon="link" data-size="15"></i>Paste a media link</button>
      </section>
    </main>
  </div>

  <dialog class="modal" id="add-dialog">
    <form method="dialog" class="modal-body" id="add-form">
      <div class="modal-head">
        <div><h3>Add a link</h3><p>Paste a direct file or an <b>.m3u8</b> stream address.</p></div>
        <button class="icon-btn" value="cancel" formnovalidate aria-label="Close"><i data-icon="x"></i></button>
      </div>
      <div class="url-row">
        <input class="input" id="add-url" type="url" placeholder="https://example.com/video/master.m3u8" required autocomplete="off">
        <button class="btn btn-soft" id="add-analyze" type="button">Analyze</button>
      </div>
      <div class="add-result" id="add-result"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn btn-primary" id="add-go" type="button" disabled><i data-icon="download" data-size="16"></i>Download</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="manager.js"></script>
</body>
</html>
