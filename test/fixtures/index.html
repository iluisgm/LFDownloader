<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sunset Session — LFDownloader test page</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #f2f2f5; color: #222; }
    main { max-width: 960px; margin: 0 auto; padding: 32px; }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    video { width: 100%; border-radius: 12px; background: #000; display: block; }
    .card { background: #fff; padding: 16px; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .player { position: relative; }
    .player .overlay { position: absolute; inset: 0; } /* custom player controls layer */
  </style>
</head>
<body>
  <main>
    <h1>Sunset Session</h1>
    <p>Test page with every kind of media LFDownloader should catch.</p>
    <div class="grid">
      <div class="card">
        <h3>Progressive MP4</h3>
        <video id="mp4" src="/media/sample.mp4" controls preload="metadata"></video>
      </div>
      <div class="card">
        <h3>Custom player (HLS via script)</h3>
        <div class="player"><video id="msevideo" muted></video><div class="overlay"></div></div>
      </div>
      <div class="card">
        <h3>Audio</h3>
        <audio id="song" src="/media/song.mp3" controls preload="metadata"></audio>
        <p><a href="/media/tone.wav">Download the tone (WAV)</a></p>
        <p><a href="/protected/song.mp3">Bonus track (hotlink-protected)</a></p>
        <p><a href="/hotlink-html/sample.mp4">Behind the scenes (serves a web page without the Referer)</a></p>
      </div>
      <div class="card">
        <h3>Streams loaded by the "player"</h3>
        <p id="log">Loading…</p>
      </div>
    </div>
  </main>
  <script>
    // Emulate what a JS video player does: fetch playlists (and a tiny beep that must be ignored).
    const urls = ['/media/hls/master.m3u8', '/media/hls-aes/index.m3u8', '/protected/hls-fmp4/stream.m3u8', '/media/hls-split/master.m3u8', '/media/beep.mp3'];
    Promise.all(urls.map((u) => fetch(u).then((r) => `${u} → ${r.status}`))).then((l) => {
      document.getElementById('log').innerHTML = l.join('<br>');
    });
  </script>
</body>
</html>
